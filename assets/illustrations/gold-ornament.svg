    <path d="M82 100 C52 100 47 120 57 130 C67 140 82 130 91 112"/>
    <path d="M118 100 C148 100 153 80 143 70 C133 60 118 70 109 88"/>
    <path d="M118 100 C148 100 153 120 143 130 C133 140 118 130 109 112"/>

    <!-- Radiating Stars -->
    <circle cx="100" cy="35" r="3" fill="#C6A15B"/>
    <circle cx="100" cy="165" r="3" fill="#C6A15B"/>
    <circle cx="35" cy="100" r="3" fill="#C6A15B"/>
    <circle cx="165" cy="100" r="3" fill="#C6A15B"/>
  </g>
