    <path d="M100 75 C100 45 120 40 130 50 C140 60 130 75 112 84"/>
    <path d="M100 125 C100 155 80 160 70 150 C60 140 70 125 88 116"/>
    <path d="M100 125 C100 155 120 160 130 150 C140 140 130 125 112 116"/>

    <!-- Side Petals -->
